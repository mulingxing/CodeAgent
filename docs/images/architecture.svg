<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">CodeAgent 系统架构</title>
  <desc id="desc">浏览器经 FastAPI 提交任务，PostgreSQL 和 Outbox 记录任务，Celery Beat、Redis 与 Worker 调度修复；Worker 调用受限 Agent 和独立验证容器；FastAPI 负责 Git 审查工作树与合并。</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop offset="0" stop-color="#f6fbfb"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <linearGradient id="dark" x2="1" y2="1"><stop offset="0" stop-color="#156f7b"/><stop offset="1" stop-color="#184c68"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#234c5c" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7baeb2"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .eyebrow { font-size: 13px; letter-spacing: 3px; font-weight: 700; fill: #25818a; }
      .title { font-size: 31px; font-weight: 750; fill: #153340; }
      .subtitle { font-size: 15px; fill: #5b7380; }
      .section { font-size: 14px; font-weight: 750; letter-spacing: 2px; fill: #4c7984; }
      .card-title { font-size: 21px; font-weight: 750; fill: #183744; }
      .card-title-light { font-size: 21px; font-weight: 750; fill: #fff; }
      .copy { font-size: 14px; fill: #57717b; }
      .copy-light { font-size: 14px; fill: #d7f1f0; }
      .pill { font-size: 12px; font-weight: 700; fill: #0f737c; }
      .edge { font-size: 12px; font-weight: 650; fill: #55828a; }
      .foot { font-size: 14px; font-weight: 650; fill: #426470; }
    </style>
  </defs>
  <rect width="1300" height="720" rx="30" fill="url(#canvas)"/>
  <circle cx="1215" cy="60" r="190" fill="#d6eee9" opacity="0.65"/>
  <text x="42" y="55" class="eyebrow">SYSTEM OVERVIEW</text>
  <text x="42" y="99" class="title">任务编排、受限修复与独立验证</text>
  <text x="42" y="130" class="subtitle">页面负责提交与审核，后台负责可靠投递和执行；关键结果持久化后再回传给页面。</text>
  <text x="42" y="174" class="section">交互与调度</text>
  <text x="42" y="420" class="section">执行与审核</text>

  <g fill="none" stroke="#7baeb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M280 277 H344"/>
    <path d="M580 277 H644"/>
    <path d="M880 277 H944"/>
    <path d="M1060 342 V463"/>
    <path d="M944 531 H879"/>
    <path d="M1062 599 V615 H462 V601"/>
    <path d="M344 321 H310 V531 H281"/>
  </g>
  <path d="M1180 531 H1220 V188 H761 V211" fill="none" stroke="#a3bdc2" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="974" y="182" class="edge">写回任务结果与事件</text>
  <text x="274" y="205" class="edge">HTTP / SSE</text>
  <text x="589" y="205" class="edge">写入</text>
  <text x="889" y="205" class="edge">投递</text>

  <g filter="url(#shadow)">
    <rect x="42" y="212" width="238" height="130" rx="19" fill="#fff" stroke="#d7e7eb"/>
    <rect x="344" y="212" width="236" height="130" rx="19" fill="#fff" stroke="#d7e7eb"/>
    <rect x="644" y="212" width="236" height="130" rx="19" fill="#fff" stroke="#d7e7eb"/>
    <rect x="944" y="212" width="236" height="130" rx="19" fill="url(#dark)"/>
    <rect x="42" y="463" width="238" height="136" rx="19" fill="#fff" stroke="#d7e7eb"/>
    <rect x="344" y="463" width="236" height="136" rx="19" fill="#fff" stroke="#d7e7eb"/>
    <rect x="644" y="463" width="236" height="136" rx="19" fill="#fff" stroke="#d7e7eb"/>
    <rect x="944" y="463" width="236" height="136" rx="19" fill="url(#dark)"/>
  </g>

  <g>
    <rect x="61" y="230" width="62" height="22" rx="11" fill="#e4f5f2"/><text x="92" y="245" class="pill" text-anchor="middle">入口</text>
    <text x="61" y="282" class="card-title">浏览器工作台</text><text x="61" y="310" class="copy">提交任务 · 查看差异和进度</text>

    <rect x="363" y="230" width="62" height="22" rx="11" fill="#e4f5f2"/><text x="394" y="245" class="pill" text-anchor="middle">接口</text>
    <text x="363" y="282" class="card-title">FastAPI</text><text x="363" y="310" class="copy">参数校验 · SSE · 审核动作</text>

    <rect x="663" y="230" width="90" height="22" rx="11" fill="#e4f5f2"/><text x="708" y="245" class="pill" text-anchor="middle">持久化</text>
    <text x="663" y="282" class="card-title">PostgreSQL</text><text x="663" y="310" class="copy">任务 · 事件 · Outbox</text>

    <rect x="963" y="230" width="90" height="22" rx="11" fill="#d7f1ec"/><text x="1008" y="245" class="pill" text-anchor="middle">异步队列</text>
    <text x="963" y="282" class="card-title-light">Redis + Celery</text><text x="963" y="310" class="copy-light">Beat 投递 · Worker 领取</text>

    <rect x="61" y="482" width="90" height="22" rx="11" fill="#e4f5f2"/><text x="106" y="497" class="pill" text-anchor="middle">人工审核</text>
    <text x="61" y="535" class="card-title">Git 工作树</text><text x="61" y="563" class="copy">独立审查 · 确认后快进合并</text>

    <rect x="363" y="482" width="90" height="22" rx="11" fill="#e4f5f2"/><text x="408" y="497" class="pill" text-anchor="middle">隔离验证</text>
    <text x="363" y="535" class="card-title">Docker Sandbox</text><text x="363" y="563" class="copy">运行测试 · 收集基线和结果</text>

    <rect x="663" y="482" width="90" height="22" rx="11" fill="#e4f5f2"/><text x="708" y="497" class="pill" text-anchor="middle">受限工具</text>
    <text x="663" y="535" class="card-title">Agent SDK</text><text x="663" y="563" class="copy">读取与修改允许的 Python 文件</text>

    <rect x="963" y="482" width="90" height="22" rx="11" fill="#d7f1ec"/><text x="1008" y="497" class="pill" text-anchor="middle">任务执行</text>
    <text x="963" y="535" class="card-title-light">Celery Worker</text><text x="963" y="563" class="copy-light">快照 · DeepSeek · 验证 · 保存</text>
  </g>

  <rect x="42" y="637" width="1138" height="48" rx="15" fill="#fff" opacity="0.82" stroke="#d8e7ea"/>
  <circle cx="69" cy="661" r="8" fill="#39a89d"/><text x="88" y="666" class="foot">候选修改先保存在任务快照中；审查工作树与所选仓库的合并由页面显式触发。</text>
</svg>
