<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590" viewBox="0 0 1300 590" role="img" aria-labelledby="title desc">
  <title id="title">CodeAgent 代码修复流程</title>
  <desc id="desc">从选择本地仓库、确认问题、Agent 生成候选修复、隔离验证到人工审核合并的五步流程。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8f3"/>
      <stop offset="0.55" stop-color="#f6fafb"/>
      <stop offset="1" stop-color="#eef1fc"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop offset="0" stop-color="#0c7f83"/>
      <stop offset="1" stop-color="#165e78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#1e5260" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7baeb2"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .eyebrow { font-size: 13px; letter-spacing: 3px; font-weight: 700; fill: #228087; }
      .heading { font-size: 31px; font-weight: 750; fill: #153340; }
      .subheading { font-size: 15px; fill: #5c7480; }
      .number { font-size: 14px; font-weight: 750; fill: #fff; }
      .card-title { font-size: 23px; font-weight: 750; fill: #183743; }
      .card-copy { font-size: 15px; fill: #536e79; }
      .tag { font-size: 13px; font-weight: 650; fill: #17717b; }
      .footer { font-size: 15px; font-weight: 650; fill: #315766; }
    </style>
  </defs>
  <rect width="1300" height="590" rx="30" fill="url(#bg)"/>
  <circle cx="1240" cy="45" r="160" fill="#d5eee9" opacity="0.55"/>
  <circle cx="90" cy="550" r="135" fill="#dce6fa" opacity="0.48"/>
  <text x="42" y="55" class="eyebrow">FROM ISSUE TO REVIEWED PATCH</text>
  <text x="42" y="98" class="heading">一次修复，从问题到可审核的补丁</text>
  <text x="42" y="129" class="subheading">每一步留下可查看的状态、差异或验证输出；最终由人决定是否应用。</text>

  <path d="M255 311 H287 M509 311 H541 M763 311 H795 M1017 311 H1049" fill="none" stroke="#7baeb2" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="36" y="166" width="220" height="290" rx="23" fill="#fff" stroke="#d6e7e9"/>
    <rect x="290" y="166" width="220" height="290" rx="23" fill="#fff" stroke="#d6e7e9"/>
    <rect x="544" y="166" width="220" height="290" rx="23" fill="#fff" stroke="#d6e7e9"/>
    <rect x="798" y="166" width="220" height="290" rx="23" fill="#fff" stroke="#d6e7e9"/>
    <rect x="1052" y="166" width="220" height="290" rx="23" fill="#fff" stroke="#b9d9d9"/>
  </g>
  <g fill="#fff" stroke="#8bbabc" stroke-width="2">
    <circle cx="273" cy="311" r="14"/><circle cx="527" cy="311" r="14"/>
    <circle cx="781" cy="311" r="14"/><circle cx="1035" cy="311" r="14"/>
  </g>
  <g fill="none" stroke="#25868a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m269 306 5 5 -5 5 M523 306 l5 5 -5 5 M777 306 l5 5 -5 5 M1031 306 l5 5 -5 5"/>
  </g>

  <g>
    <circle cx="76" cy="207" r="22" fill="url(#accent)"/><text x="76" y="212" class="number" text-anchor="middle">01</text>
    <circle cx="330" cy="207" r="22" fill="url(#accent)"/><text x="330" y="212" class="number" text-anchor="middle">02</text>
    <circle cx="584" cy="207" r="22" fill="url(#accent)"/><text x="584" y="212" class="number" text-anchor="middle">03</text>
    <circle cx="838" cy="207" r="22" fill="url(#accent)"/><text x="838" y="212" class="number" text-anchor="middle">04</text>
    <circle cx="1092" cy="207" r="22" fill="url(#accent)"/><text x="1092" y="212" class="number" text-anchor="middle">05</text>
  </g>

  <g fill="none" stroke="#25868a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M73 259 h25 a6 6 0 0 1 6 6 v17 a6 6 0 0 1 -6 6 H64 a6 6 0 0 1 -6 -6 v-24 a6 6 0 0 1 6 -6 h8 z"/>
    <path d="M326 252 v19 l-10 14 a6 6 0 0 0 5 9 h31 a6 6 0 0 0 5 -9 l-10 -14 v-19 M320 252 h33 M324 279 h25"/>
    <path d="M586 258 l-13 13 13 13 M605 258 l13 13 -13 13 M598 252 l-8 39"/>
    <rect x="822" y="252" width="42" height="42" rx="9"/><path d="m831 273 9 9 16 -19"/>
    <path d="M1076 274 c10 -15 32 -15 42 0 -10 15 -32 15 -42 0 z"/><circle cx="1097" cy="274" r="7"/>
  </g>

  <text x="58" y="331" class="card-title">提交问题</text>
  <text x="58" y="363" class="card-copy">选择已提交的仓库，</text><text x="58" y="386" class="card-copy">写明问题和验证方式。</text>
  <rect x="58" y="414" width="107" height="25" rx="12" fill="#e6f5f3"/><text x="111" y="431" class="tag" text-anchor="middle">本地 Git 仓库</text>

  <text x="312" y="331" class="card-title">确认问题</text>
  <text x="312" y="363" class="card-copy">固定提交快照；有检查时</text><text x="312" y="386" class="card-copy">先记录修复前结果。</text>
  <rect x="312" y="414" width="106" height="25" rx="12" fill="#e6f5f3"/><text x="365" y="431" class="tag" text-anchor="middle">修复前输出</text>

  <text x="566" y="331" class="card-title">生成修复</text>
  <text x="566" y="363" class="card-copy">Agent 用受限文件工具</text><text x="566" y="386" class="card-copy">修改已有 Python 源码。</text>
  <rect x="566" y="414" width="84" height="25" rx="12" fill="#e6f5f3"/><text x="608" y="431" class="tag" text-anchor="middle">候选差异</text>

  <text x="820" y="331" class="card-title">隔离复验</text>
  <text x="820" y="363" class="card-copy">在独立容器里运行检查，</text><text x="820" y="386" class="card-copy">保存输出和进度事件。</text>
  <rect x="820" y="414" width="84" height="25" rx="12" fill="#e6f5f3"/><text x="862" y="431" class="tag" text-anchor="middle">验证证据</text>

  <text x="1074" y="331" class="card-title">人工审核</text>
  <text x="1074" y="363" class="card-copy">检查差异与测试，生成</text><text x="1074" y="386" class="card-copy">审查工作树后确认合并。</text>
  <rect x="1074" y="414" width="106" height="25" rx="12" fill="#e6f5f3"/><text x="1127" y="431" class="tag" text-anchor="middle">人工确认</text>

  <rect x="38" y="489" width="1224" height="64" rx="17" fill="#ffffff" opacity="0.85" stroke="#d4e6e9"/>
  <circle cx="74" cy="521" r="11" fill="#2ca99b"/>
  <path d="m69 521 4 4 7 -9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="99" y="527" class="footer">任务状态、逐行差异、验证输出和审核动作都能在工作台回看</text>
</svg>
